name: Primary database authentication checks

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN_PRIMARY_AUTH_TESTS to authorize exact test-row writes
        required: true
        type: string

concurrency:
  group: primary-database-authentication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  auth-primary:
    if: ${{ inputs.confirmation == 'RUN_PRIMARY_AUTH_TESTS' }}
    environment: primary-database
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      DATABASE_URL: ${{ secrets.PRIMARY_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:auth:primary
      - run: npm run test:auth:primary:e2e
