services:
  postgres:
    image: postgres:16-alpine
    container_name: fileflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fileflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fileflow_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-fileflow_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fileflow_backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      BACKEND_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ./backend/app:/app/app
      - backend_temp:/app/temp

  frontend:
    image: node:24-alpine
    container_name: fileflow_frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://fileflow:fileflow_local_password@postgres:5432/fileflow_db}
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:-postgresql://fileflow:fileflow_local_password@postgres:5432/fileflow_db}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-fileflow_local_development_secret_32_chars}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  backend_temp:
  frontend_node_modules:
